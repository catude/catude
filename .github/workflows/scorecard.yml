name: scorecard
# OpenSSF Scorecard: how the project protects its supply chain (branch protection, pinned actions,
# signed releases, dependency updates…). Results under Security, Code scanning, and on scorecard.dev.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
