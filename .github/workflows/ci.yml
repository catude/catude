name: ci
# Every push to main and every pull request: format, vet, tests on the three systems, a build for every
# platform a release ships, known vulnerabilities in dependencies, and leaked secrets. Pull requests also
# get the binaries as an artifact, so anyone can try the change before it is merged.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable # always the latest Go with its security fixes; go.mod keeps the minimum for go install
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Run gofmt -w on:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: translations are complete
        run: |
          node scripts/i18n-extract.mjs
          git diff --exit-code internal/i18n/locales/messages.json || (echo "Run node scripts/i18n-extract.mjs and add the new strings to every catalog"; exit 1)

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable # always the latest Go with its security fixes; go.mod keeps the minimum for go install
      - run: go test -race -count=1 ./...

  minimum-go:
    # go install users may have an older Go: the minimum in go.mod must still build and pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./... && go test -count=1 ./...

  build:
    # every platform of a release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable # always the latest Go with its security fixes; go.mod keeps the minimum for go install
      - name: build ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
        run: |
          T=${{ matrix.target }}; GOOS=${T%/*}; GOARCH=${T#*/}
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w -X main.version=dev-${GITHUB_SHA::7}" -o "dist/catude-$GOOS-$GOARCH$ext" ./cmd/catude
          ls -l dist
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: catude-${{ strategy.job-index }}
          path: dist/
          retention-days: 14

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable # always the latest Go with its security fixes; go.mod keeps the minimum for go install
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: latest # the [[allowlists]] format of .gitleaks.toml needs gitleaks 8.25 or later
