name: pages
# The documentation site, https://catude.github.io/catude/, built from docs/ with MkDocs (mkdocs.yml) and
# published on GitHub Pages. It also publishes llms.txt, llms-full.txt and a Markdown copy of every page,
# so people can hand the docs to an AI assistant. Pull requests only build it (strict: broken links fail).
on:
  push:
    branches: [main]
    paths: ["docs/**", "assets/**", "mkdocs.yml", "docs-site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "assets/**", "mkdocs.yml", "docs-site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: pip install -r docs-site/requirements.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
