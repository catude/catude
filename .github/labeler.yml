      - any-glob-to-any-file: cmd/**
config:
  - changed-files:
      - any-glob-to-any-file: [internal/claudecfg/**, internal/paths/**]
usage:
  - changed-files:
      - any-glob-to-any-file: [internal/sessions/**, internal/agentmap/**, internal/live/**]
security:
